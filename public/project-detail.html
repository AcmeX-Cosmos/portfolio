<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Detail</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #040706;
        --panel: rgba(10, 18, 16, 0.86);
        --line: rgba(216, 255, 63, 0.2);
        --accent: #d8ff3f;
        --text: #f4f8ee;
        --muted: #aeb9ab;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at 14% 10%, color-mix(in srgb, var(--accent), transparent 84%), transparent 28rem),
          linear-gradient(135deg, #020403, #07120f 64%, #020403);
        color: var(--text);
      }

      main {
        display: grid;
        gap: 26px;
        width: min(calc(100% - 44px), 1280px);
        margin: 0 auto;
        padding: 34px 0 46px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
        gap: 24px;
        align-items: stretch;
      }

      .hero-copy,
      .media-panel,
      .detail-card,
      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.28);
      }

      .hero-copy {
        padding: 34px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 950;
        letter-spacing: 0.16em;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        max-width: 850px;
        font-size: clamp(38px, 6vw, 82px);
        line-height: 0.98;
      }

      .summary {
        max-width: 860px;
        margin-top: 22px;
        color: #c8d2c2;
        font-size: 17px;
        line-height: 1.86;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 24px;
      }

      .tags span {
        padding: 7px 11px;
        border: 1px solid color-mix(in srgb, var(--accent), transparent 68%);
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent), transparent 91%);
        color: #efffdb;
        font-size: 12px;
        font-weight: 800;
      }

      .media-panel {
        overflow: hidden;
      }

      .media-panel img {
        width: 100%;
        height: 100%;
        min-height: 320px;
        object-fit: cover;
        filter: saturate(1.05) contrast(1.08);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .metric {
        padding: 20px;
      }

      .metric strong {
        display: block;
        color: var(--accent);
        font-size: 30px;
        line-height: 1;
      }

      .metric span {
        display: block;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .detail-card {
        display: grid;
        gap: 14px;
        min-height: 280px;
        padding: 24px;
      }

      .detail-card h2 {
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.16em;
      }

      .detail-card h3 {
        font-size: 23px;
        line-height: 1.25;
      }

      .detail-card p,
      .detail-card li {
        color: #bdc8b7;
        font-size: 14px;
        line-height: 1.72;
      }

      ul {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        padding-left: 17px;
      }

      li::before {
        position: absolute;
        top: 0.68em;
        left: 0;
        width: 7px;
        height: 7px;
        content: "";
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
      }

      @media (max-width: 880px) {
        main {
          width: min(calc(100% - 28px), 1280px);
          padding-top: 20px;
        }

        .hero,
        .metrics,
        .detail-grid {
          grid-template-columns: 1fr;
        }

        .hero-copy,
        .detail-card,
        .metric {
          padding: 20px;
        }
      }

      @media (max-width: 520px) {
        main {
          gap: 16px;
          width: min(calc(100% - 20px), 1280px);
          padding: 14px 0 28px;
        }

        .hero {
          gap: 14px;
        }

        .hero-copy,
        .detail-card,
        .metric {
          padding: 16px;
        }

        h1 {
          font-size: clamp(30px, 10vw, 44px);
          line-height: 1.05;
        }

        .summary {
          margin-top: 16px;
          font-size: 15px;
          line-height: 1.7;
        }

        .media-panel img {
          min-height: 210px;
          max-height: 280px;
        }

        .metric strong {
          font-size: 26px;
        }

        .detail-card {
          min-height: auto;
        }

        .detail-card h3 {
          font-size: 21px;
        }
      }
    </style>

      }

      .metrics {

        grid-template-columns: repeat(3, minmax(0, 1fr));

      .metric {

      .metric strong {

      }

      .metric span {

        color: #8b978f;

              <img src="${resolveImage(src)}" alt="${caption}" loading="lazy" decoding="async" />
              <figcaption>${caption}</figcaption>
            </figure>
          `,
        )
        .join("");

      const renderList = (items) => items.map((item) => `<li>${item}</li>`).join("");
      document.getElementById("responsibilities").innerHTML = renderList(report.responsibilities);
      document.getElementById("outcomes").innerHTML = renderList(report.outcomes);
      document.getElementById("next-steps").innerHTML = renderList(report.next);
    </script>
  </body>
</html>
